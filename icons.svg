
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <!-- Cube / Kaaba Graphic -->
  <g transform="translate(0, 10)">
    <!-- Top face -->
    <polygon points="250,75 340,110 250,145 160,110" fill="#78b928" />
    <!-- Front face -->
    <path d="M 160,110 L 250,145 L 250,235 L 160,200 Z" fill="#31700e" />
    <!-- Side face -->
    <path d="M 340,110 L 250,145 L 250,235 L 340,200 Z" fill="#529910" />
    
    <!-- Letters U and B on the cube faces -->
    <g fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold" font-size="60">
      <!-- U on front face -->
      <text x="180" y="175" transform="skewY(22)">U</text>
      <!-- B on side face -->
      <text x="270" y="175" transform="skewY(-22)">B</text>
    </g>
  </g>

  <!-- Airplane & Swoosh -->
  <g id="airplane-swoosh">
    <!-- Airplane -->
    <path d="M 345,115 L 327,123 L 332,128 L 341,122 L 350,135 L 354,133 L 346,120 L 356,117 C 358,116 358,114 356,113 C 354,112 352,112 345,115 Z" fill="#2d6a11" transform="rotate(-15, 340, 120)" />
    
    <!-- Green Swoosh Underline -->
    <path d="M 145,230 C 200,265 300,265 365,230 C 320,258 230,258 145,230 Z" fill="#7bc11f" />
  </g>

  <!-- Typography -->
  <g text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold">
    <!-- UmrahBISA -->
    <text x="250" y="300" font-size="50">
      <tspan fill="#1e6b23">Umrah</tspan><tspan fill="#7cb828">BISA</tspan>
    </text>
    <!-- Tagline: Semua BISA Umrah -->
    <text x="250" y="335" font-size="24">
      <tspan fill="#8bc34a">Semua </tspan><tspan fill="#1e4620">BISA </tspan><tspan fill="#8bc34a">Umrah</tspan>
    </text>
    <!-- Location: Yogyakarta -->
    <text x="250" y="375" font-size="30" fill="#104318">
      Yogyakarta
    </text>
  </g>
</svg>
